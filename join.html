<html>
  <head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-box">
        <a href="index.html" class=""
          ><img src="img/logo.svg" alt="판다마켓 로고"
        /></a>
        <div class="form-box">
          <form class="login-form" id="login-form" action="./login.html">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="아이디"
              required
            />
            <p class="error-message" id="email-error"></p>
            <label for="nickName">닉네임</label>
            <input
              type="text"
              id="nickName"
              name="nickName"
              placeholder="닉네임"
              required
            />
            <p class="error-message" id="nickname-error"></p>
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호"
              required
            />
            <p class="error-message" id="password-error"></p>
            <label for="passwordCheck">비밀번호 확인</label>
            <input
              type="password"
              id="passwordCheck"
              name="passwordCheck"
              placeholder="비밀번호 확인"
              required
            />
            <p class="error-message" id="passwordCheckError"></p>
            <button class="login-button" id="join-button" disabled>
              회원가입
            </button>
          </form>
          <div id="simple-login">
            <span>간편 로그인 하기</span>
            <div>
              <a href="https://www.google.com" target="_blank"
                ><img src="img/ic_google.svg"
              /></a>
              <a href="https://www.kakaocorp.com/page/" target="_blank"
                ><img src="img/ic_kakao.svg"
              /></a>
            </div>
          </div>
          <div class="join-info">
            이미 회원이신가요? <a href="login.html">로그인</a>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/join.js"></script>
  </body>
</html>
