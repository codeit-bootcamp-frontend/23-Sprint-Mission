<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 | 판다마켓</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <!-- 로고 -->
        <header class="login-header">
          <img src="../images/logo.png" alt="판다마켓 로고" class="logo-icon" />
          <a href="../html/index.html">
            <h1 class="logo-text">판다마켓</h1>
          </a>
        </header>

        <!-- 회원가입 폼 -->
        <form class="signup-form" id="signup-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              placeholder="이메일을 입력해 주세요"
            />
            <span id="emailEmptyError" class="error-message"
              >이메일을 입력해 주세요</span
            >
            <span id="emailInvalidError" class="error-message"
              >잘못된 이메일 형식입니다</span
            >
          </div>

          <div class="input-group">
            <label for="nickname">닉네임</label>
            <input
              type="text"
              id="nickname"
              placeholder="닉네임을 입력해 주세요"
            />
            <span id="nicknameEmptyError" class="error-message"
              >닉네임을 입력해주세요</span
            >
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <div class="input-group-password">
              <input
                type="password"
                id="password"
                placeholder="비밀번호를 입력해 주세요"
              />
              <img
                class="password-image"
                src="../images/icon-close-eye.png"
                alt="비밀번호가림 이미지"
              />
            </div>
            <span id="passwordEmptyError" class="error-message"
              >비밀번호를 입력해 주세요</span
            >
            <span id="passwordInvalidError" class="error-message"
              >비밀번호를 8자 이상 입력해 주세요</span
            >
          </div>

          <div class="input-group">
            <label for="password-check">비밀번호 확인</label>
            <div class="input-group-password">
              <input
                type="password"
                id="password-check"
                placeholder="비밀번호를 다시 한 번 입력해 주세요"
              />
              <img
                class="password-image"
                src="../images/icon-close-eye.png"
                alt="비밀번호가림 이미지"
              />
            </div>
            <span id="passwordConfirmationInitError" class="error-message"
              >조건에 맞는 비밀번호를 입력해 주세요.</span
            >
            <span id="passwordConfirmationError" class="error-message"
              >비밀번호가 일치하지 않습니다.</span
            >
          </div>

          <button type="submit" class="login-button">회원가입</button>

          <div class="social-login">
            <span class="social-title">간편 로그인하기</span>

            <div class="social-icons">
              <a
                href="https://www.google.com/"
                target="_blank"
                class="social-icon google"
              >
                <img src="../images/google.png" alt="구글 로그인" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                class="social-icon kakao"
              >
                <img src="../images/kakao.png" alt="카카오 로그인" />
              </a>
            </div>
          </div>
        </form>

        <!-- 로그인 이동 -->
        <p class="signup-text">
          이미 회원이신가요?
          <a href="./login.html">로그인</a>
        </p>
      </section>
    </main>
    <script src="../scripts/auth.js"></script>
  </body>
</html>
