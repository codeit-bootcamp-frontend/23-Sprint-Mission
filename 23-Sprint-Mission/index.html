<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="hd">
      <nav class="nv">
        <a href="/"><img src="./images/logo.svg" alt="판다마켓 로고" /></a>
        <a class="login" href="/login">로그인</a>
      </nav>
    </header>
    <main>
      <section class="sec1">
        <div class="total-add">
          <div class="try_and_btn">
            <h1 class="try-text">일상의 모든 물건을<br />거래해 보세요</h1>
            <a class="btn1" href="/items">구경하러 가기</a>
          </div>
          <img class="pnd" src="./images/panda.png" alt="판다 쇼핑 이미지" />
        </div>
      </section>

      <!-- Hot Items 섹션 -->
      <section class="httms">
        <div class="hot-back">
          <img class="hot-img" src="./images/shirt.png" alt="인기상품 이미지" />
          <div class="hot-text">
            <h3 class="hot-h3">Hot items</h3>
            <div class="hot-txt2">
              <h1 class="hot-h1">인기 상품을<br />확인해 보세요</h1>
              <p class="hot-p">
                가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Search 섹션 -->
      <section class="httms srch">
        <div class="hot-back srch">
          <img
            class="hot-img srch"
            src="./images/serch.png"
            alt="상품 검색 사진"
          />
          <div class="hot-text srch">
            <h3 class="hot-h3 srch">Search</h3>
            <div class="hot-txt2 srch">
              <h1 class="hot-h1 srch">구매를 원하는<br />상품을 검색하세요</h1>
              <p class="hot-p srch">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Register 섹션 -->
      <section class="httms">
        <div class="hot-back">
          <img class="hot-img" src="./images/folder.png" alt="폴더 이미지" />
          <div class="hot-text rgst">
            <h3 class="hot-h3">Register</h3>
            <div class="hot-txt2 rgst">
              <h1 class="hot-h1 rgst">판매를 원하는<br />상품을 등록하세요</h1>
              <p class="hot-p rgst">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="bar"></div>
      </section>

      <!-- panda 섹션 -->
      <section class="cht-sec">
        <div class="cht-2">
          <h1 class="cht-h1">믿을 수 있는<br />판다마켓 중고 거래</h1>
          <img
            class="cht-img"
            src="/images/chating.png"
            alt="판다대화 이미지"
          />
        </div>
      </section>
      <footer class="ftb">
        <div class="ftb-div1">
          <p class="codeit">&copy;codeit - 2024</p>
          <div class="ftb-div2">
            <a class="psc" href="/privacy">Privacy Policy</a>
            <a class="faq" href="/faq">FAQ</a>
          </div>
          <div class="ftb-imgs">
            <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
              <img
                class="img1"
                src="/images/facebook.png"
                alt="페이스북 로고"
              />
            </a>
            <a href="https://x.com/?lang=ko" target="_blank">
              <img class="img2" src="/images/twiter.png" alt="트위터 로고" />
            </a>
            <a
              href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR"
              target="_blank"
            >
              <img class="img3" src="/images/youtube.png" alt="유튜브 로고" />
            </a>
            <a href="https://www.instagram.com/" target="_blank">
              <img class="img4" src="/images/insta.png" alt="인스타그램 로고" />
            </a>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
