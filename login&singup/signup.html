<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓: 회원가입</title>

    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="./login&signup.css" />
  </head>
  <body>
    <section class="container">
      <a href="../index.html">
        <img class="logo" src="../assets/images/Img_logo.svg" />
      </a>
      <div class="contents-container">
        <form class="input-wrapper">
          <label class="labels" for="email">이메일</label>
          <input name="email" class="inputs" id="email" type="email" />

          <label class="labels" for="name">닉네임</label>
          <input name="name" class="inputs" id="name" type="text" />

          <label class="labels" for="pwd">비밀번호</label>
          <div class="password-wrapper">
            <input name="pwd" class="inputs" id="pwd" type="password" />
            <button type="button" class="visibility">
              <img
                src="../assets/images/Img_visibility.svg"
                alt="invisible-logo"
              />
            </button>
          </div>

          <label class="labels" for="check">비밀번호 확인</label>
          <div class="password-wrapper">
            <input name="check" class="inputs" id="check" type="password" />
            <button type="button" class="visibility">
              <img
                src="../assets/images/Img_visibility2.svg"
                alt="invisible-logo"
              />
            </button>
          </div>

          <button class="main-button" type="submit">회원가입</button>
        </form>

        <div class="easy-login">
          <p>간편 로그인</p>
          <div class="easy-login-logos">
            <a href="https://www.google.com/">
              <img src="../assets/images/Img_google.svg" alt="google logo" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="../assets/images/Img_kakao.svg" alt="kakao logo" />
            </a>
          </div>
        </div>

        <p class="footer-wrapper">
          이미 회원이신가요?
          <a class="signupOrLogin" href="./login.html">로그인</a>
        </p>
      </div>
    </section>
  </body>
</html>
