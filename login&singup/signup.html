<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓: 회원가입</title>

    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="./login&signup.css" />

    <script type="module" src="./signup.js"></script>
    <script type="module" src="./login.js"></script>
  </head>
  <body>
    <section class="container">
      <a href="../index.html">
        <img class="logo" src="../assets/images/Img_logo.svg" />
      </a>
      <div class="contents-container">
        <form class="input-wrapper">
          <label class="labels" for="email">이메일</label>
          <div>
            <input
              name="email"
              class="inputs email"
              id="email"
              type="email"
              autofocus
              required
              placeholder="이메일을 입력해주세요"
            />
            <p class="type-email-msg err-msg">이메일을 입력해주세요.</p>
            <p class="wrong-email-msg err-msg">잘못된 이메일입니다.</p>
          </div>

          <label class="labels" for="name">닉네임</label>
          <div>
            <input
              name="name"
              class="inputs nickname"
              id="name"
              type="text"
              required
              placeholder="닉네임을 입력해주세요"
            />
            <p class="type-nickname-msg err-msg">닉네임을 입력해주세요</p>
          </div>

          <label class="labels" for="pwd">비밀번호</label>
          <div class="password-wrapper">
            <div>
              <input
                name="pwd"
                class="inputs password"
                id="pwd"
                type="password"
                required
                placeholder="비밀번호를 입력해주세요"
              />
              <p class="type-pwd-msg err-msg">비밀번호를 입력해주세요</p>
              <p class="more-than-8 err-msg">
                비밀번호를 8자 이상 입력해주세요
              </p>
            </div>

            <button type="button" class="visibility">
              <img
                src="../assets/images/Img_visibility.svg"
                alt="invisible-logo"
              />
            </button>
          </div>

          <label class="labels" for="check">비밀번호 확인</label>
          <div class="password-wrapper">
            <div>
              <input
                name="check"
                class="inputs pwdValid"
                id="check"
                type="password"
                required
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <p class="pwd-valid-msg err-msg">비밀번호가 일치하지 않습니다.</p>
            </div>
            <button type="button" class="visibility">
              <img
                src="../assets/images/Img_visibility2.svg"
                alt="invisible-logo"
              />
            </button>
          </div>

          <button class="main-button" type="submit">회원가입</button>
        </form>

        <div class="easy-login">
          <p>간편 로그인</p>
          <div class="easy-login-logos">
            <a href="https://www.google.com/">
              <img src="../assets/images/Img_google.svg" alt="google logo" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="../assets/images/Img_kakao.svg" alt="kakao logo" />
            </a>
          </div>
        </div>

        <p class="footer-wrapper">
          이미 회원이신가요?
          <a class="signup-or-login" href="./login.html">로그인</a>
        </p>
      </div>
    </section>
  </body>
</html>
