<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- <h1>판다마켓 중고거래</h1> -->
    <header class="gnb">
      <nav class="">
        <a href="/">
          <img src="./images/logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="btn-small-48 login-button" href="/login">로그인</a>
      </nav>
    </header>

    <main>
      <section class="landing-header">
        <div>
          <div class="landing-header-content">
            <h1 class="landing-heading">일상의 모든 물건을 거래해보세요</h1>
            <a class="btn-large">구경하러 가기</a>
          </div>
          <img src="./images/landing/landing-content-header.svg" />
        </div>
      </section>

      <div class="landing-body">
        <section class="landing-section">
          <img src="./images/landing/landing-section-1.svg" alt="" />

          <div class="landing-section-content w-274">
            <span>Hot Item</span>
            <div>
              <h2 class="landing-heading">인기 상품을 확인해 보세요</h2>
              <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
            </div>
          </div>
        </section>
        <section class="landing-section flex-reverse">
          <img src="./images/landing/landing-section-2.svg" alt="" />

          <div class="landing-section-content w-288 text-right">
            <span>Search</span>
            <div>
              <h2 class="landing-heading">구매를 원하는 상품을 검색하세요</h2>
              <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
            </div>
          </div>
        </section>
        <section class="landing-section">
          <img src="./images/landing/landing-section-3.svg" alt="" />

          <div class="landing-section-content w-335">
            <span>Register</span>
            <div>
              <h2 class="landing-heading">판매를 원하는 상품을 등록하세요</h2>
              <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
