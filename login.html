<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/global.css" type="text/css" />
    <link rel="stylesheet" href="styles/login.css" type="text/css" />
    <title>판다마켓 - 로그인</title>
  </head>
  <body>
    <main id="main">
      <img class="logo" src="assets/logo.svg" width="396px" height="132px" />
      <form id="loginForm">
        <label class="label" for="emailInput">이메일</label>
        <div class="emailInputBox">
          <input
            id="emailInput"
            placeholder="codeit@email.com"
            name="email"
            type="email"
            required
          />
        </div>
        <br />
        <label class="label" for="pwInput">비밀번호</label>
        <div class="pwInputBox">
          <input
            id="pwInput"
            placeholder="비밀번호를 입력해주세요."
            type="password"
            name="password"
            required
          />
          <img src="assets/visibility_off.svg" width="24px" height="24px" />
        </div>
        <button id="loginBtn">로그인</button>
      </form>
      <div class="socialLogin">
        <span class="socialInfo">간편 로그인하기</span>
        <ul class="logoBox">
          <a href="https://www.google.com/">
            <img alt="구글 로그인 버튼" src="assets/snslogos/googlelogo.svg" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img
              alt="카카오톡 로그인 버튼"
              src="assets/snslogos/kakaologo.svg"
            />
          </a>
        </ul>
      </div>

      <span class="footInfo"
        >판다마켓이 처음이신가요?
        <a id="signupLink" href="/signup.html">회원가입</a></span
      >
    </main>
  </body>
</html>
