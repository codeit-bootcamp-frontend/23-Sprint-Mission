<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/login.css">
  </head>
  <body>
    <header>
      <a class="home-button" href="/">
        <img class="header-logo" src="./img/Img_logo_lg.png" alt="판다마켓 로고">
      </a>
    </header>
    <main class="main">
      <form class="main-form">
        <div class="input">
          <label for="login-email">이메일</label>
          <input 
            id="login-email" 
            class="input-main" 
            name="email" 
            type="email" 
            placeholder="이메일을 입력해주세요" 
            required
          >
          <p class="error-message"></p>
        </div>
        <div class="input">
          <label for="login-password">비밀번호</label>
          <div class="login-password-content">
            <input 
              id="login-password" 
              class="input-main" 
              name="password" 
              type="password" 
              placeholder="비밀번호를 입력해주세요" 
              required
            >
            <img class="visibility-button" src="./img/ic_visibility_off.svg" alt="비밀번호 숨김/보기 버튼">
          </div>
          <p class="error-message"></p>
        </div>
        <button class="login-button" type="button" disabled>
          로그인
        </button>
      </form>
      <div class="social-login">
        <span>간편 로그인하기</span>
        <div class="social-login-buttons">
          <a class="social-login-button" href="https://www.google.com/">
            <img class="social-image" src="./img/ic_google.svg" alt="구글 로그인 버튼">
          </a>
          <a class="social-login-button" href="https://www.kakaocorp.com/page/">
            <img class="social-image" src="./img/ic_kakao.svg" alt="카카오 로그인 버튼">
          </a>
        </div>
      </div>
      <div class="signup">
        <span class="signup-script">판다마켓이 처음이신가요?</span>
        <a class="signup-button" href="./signup.html">회원가입</a>
      </div>
    </main>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
