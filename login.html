<!-- 로그인 페이지 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/login.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-box">
        <a href="/">
          <img class="pandaLogo" src="img/logo.svg" alt="판다마켓 로고" />
        </a>
        <form class="login-form" action="#">
          <!-- 이메일 입력 -->
          <div class="field">
            <label class="email-label" for="email">이메일</label>

            <div class="field-body">
              <input
                class="email-input"
                id="email"
                type="email"
                required
                placeholder="이메일을 입력해주세요"
              />
              <!-- 에러 : 잘못된 이메일입니다.-->
              <p class="email-error-message" id="email-error-message"></p>
            </div>
          </div>
          <!-- 비밀번호 입력 -->
          <div class="field">
            <label class="passwd-label" for="password">비밀번호</label>

            <div class="field-body">
              <input
                class="passwd-input"
                id="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <!-- 에러 : 비밀번호를 8자 이상 입력해주세요.-->
              <p class="passwd-error-message" id="passwd-error-message"></p>
            </div>
          </div>
          <!-- 로그인 -->
          <div class="actions">
            <button
              class="login-button"
              id="login-button"
              type="submit"
              disabled
            >
              로그인
            </button>
          </div>
          <!-- 간편 로그인하기 -->
          <div class="social-login">
            <span class="social-text">간편 로그인하기</span>
            <div class="social-icons">
              <a href="https://www.google.com/"
                ><img src="img/icon_google.svg" alt="구글 아이콘"
              /></a>
              <a href="https://www.kakaocorp.com/page"
                ><img src="img/icon_kakao.svg" alt="카카오 아이콘"
              /></a>
            </div>
          </div>
          <!-- 판다마켓이 처음이신가요? 회원가입 링크 -->
          <div class="signup">
            <span class="signup-text">판다마켓이 처음이신가요?</span>
            <a class="signup-page" href="signup.html">회원가입</a>
          </div>
        </form>
      </section>
    </main>
    <script src="js/login.js"></script>
  </body>
</html>
