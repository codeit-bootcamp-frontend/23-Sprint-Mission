<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓: 로그인</title>

    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <section class="login">
      <a href="./index.html">
        <img class="logo" src="./assets/images/Img_logo.svg" />
      </a>
      <div class="login-container">
        <label class="labels" for="email">이메일</label>
        <input name="email" class="inputs" type="email" id="email" />
        <label class="labels" for="pwd">비밀번호</label>
        <div class="input-wrapper">
          <input name="password" class="inputs" type="password" id="pwd" />
          <button type="button" class="visibility">
            <img
              src="./assets/images/Img_visibility.svg"
              alt="invisible-logo"
            />
          </button>
        </div>
        <button class="login-button" type="submit">로그인</button>

        <div class="easy-login">
          <p>간편 로그인</p>
          <div class="easy-login-logos">
            <a href="https://www.google.com/">
              <img src="./assets/images/Img_google.svg" alt="google logo" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="./assets/images/Img_kakao.svg" alt="kakao logo" />
            </a>
          </div>
        </div>

        <p class="sign-up-wrapper">
          판다마켓이 처음이신가요?
          <a class="signup" href="./signup">회원가입</a>
        </p>
      </div>
    </section>
  </body>
</html>
