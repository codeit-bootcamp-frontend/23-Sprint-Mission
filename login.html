<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/reset.css" type="text/css" rel="stylesheet">
        <link href="css/login.css" type="text/css" rel="stylesheet">
        <title>판다마켓</title>
    </head>
    <body>
        <header class="login-header">
            <a class="login-logo" href="index.html">
                <img src="images/logo.png" alt="logo">
            </a>
        </header>
        
        <main class="main-login">
            <form>
                <div class="form-login">
                    <label for="user-email">이메일</label>
                    <input type="email" id="user-email" name="user-email" placeholder="이메일을 입력해주세요" required>
                </div>
                <div class="form-login">
                    <label for="user-pw">비밀번호</label>
                    <input type="password" id="user-pw" name="user-pw" placeholder="비밀번호를 입력해주세요" required>
                    <button type="button" class="login-toggle" aria-label="비밀번호 보기">
                        <img src="images/sign_images/password-hidden.svg">
                    </button>
                </div>
                <a class="login-login-btn" href="#">로그인</a>
            </form>

            <div class="social-login">
                간편 로그인하기
                <ul>
                    <li>
                        <a href="https://www.google.com">
                            <img src="images/sign_images/ic_google.svg" alt="google">
                        </a>
                    </li>
                    <li>
                        <a href="https://www.kakaocorp.com/page">
                            <img src="images/sign_images/ic_kakao.svg" alt="kakao">
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="auth-footer">
                판다마켓이 처음이신가요? <a href="/signup.html">회원가입</a>
            </div>
        </main>
    </body>
</html>
