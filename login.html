<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/login_signup.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css"
    />
  </head>
  <body>
    <main>
      <section class="section-form wrap">
        <div class="box-img">
          <a href="/"><img src="./images/logo.svg" alt="판다마켓 로고" /></a>
        </div>
        <div class="box-form">
          <form class="form-login">
            <div>
              <label for="email">이메일</label>
              <input
                id="email"
                type="email"
                name="email"
                placeholder="이메일을 입력해주세요"
                maxlength="30"
                required
              />
            </div>
            <div class="input-password">
              <label for="password">비밀번호</label>
              <input
                id="password"
                type="password"
                name="password"
                placeholder="비밀번호를 입력해주세요"
                maxlength="20"
                required
              />
              <img src="./images/password-off.svg" alt="비밀번호 가리기 아이콘">
            </div>
            <div>
              <button type="submit" disabled>로그인</button>
            </div>
          </form>
        </div>
        <div class="box-easylogin">
          <p>간편 로그인하기</p>
          <ul class="easylogin-icon">
            <li>
              <a href="https://www.google.com/">
                <img src="./images/login-icon01.svg" alt="구글 아이콘" />
              </a>
            </li>
            <li>
              <a href="https://www.kakaocorp.com/page/">
                <img src="./images/login-icon02.svg" alt="카카오 아이콘" />
              </a>
            </li>
          </ul>
        </div>
        <p>판다마켓이 처음이신가요?<a href="/signup.html">회원가입</a></p>
      </section>
    </main>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
