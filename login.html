<!-- 로그인 페이지 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/login.css" />
    <title>판다마켓 로그인</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-box">
        <img class="pandaLogo" src="img/logo.svg" alt="판다마켓 로고" />
        <form class="login-form" action="#">
          <!-- 이메일 입력 -->
          <div class="field">
            <label class="email-label" for="email">이메일</label>
            <input
              class="email-input"
              id="email"
              type="email"
              placeholder="codeit@email.com"
            />
          </div>
          <!-- 비밀번호 입력 -->
          <div class="field">
            <label class="pass-label" for="password">비밀번호</label>
            <div class="password-eyeicon">
              <input class="pass-input" id="password" type="password" />
            </div>
          </div>
          <!-- 로그인 -->
          <div class="actions">
            <button class="login-button" type="submit">로그인</button>
          </div>
          <!-- 간편 로그인하기 -->
          <div class="social-login">
            <span class="social-text">간편 로그인하기</span>
            <div class="social-icons">
              <a href="https://www.google.com/"
                ><img src="img/ic_google.svg" alt="구글 아이콘"
              /></a>
              <a href="https://www.kakaocorp.com/page"
                ><img src="img/ic_kakao.svg" alt="카카오 아이콘"
              /></a>
            </div>
          </div>
          <!-- 판다마켓이 처음이신가요? 회원가입 링크 -->
          <div class="signup">
            <span class="signup-text">판다마켓이 처음이신가요?</span>
            <a class="signup-page" href="signup.html">회원가입</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
