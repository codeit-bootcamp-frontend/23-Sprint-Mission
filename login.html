<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div id="wrap">
        <div class="section-login">
            <div class="login-inner">
                <a href="/" class="login-logo"><img src="img/pandamarket_logo.svg" alt="판다마켓로고"></a>
                <div class="login-input-box">
                    <form action="">
                        <div class="login-input">
                            <label for="email" class="login-label">이메일</label>
                            <input id="email" type="text" placeholder="이메일을 입력하세요">
                        </div>
                        <div class="login-input">
                            <label for="password" class="login-label">비밀번호</label>
                            <div class="login-input">
                                <input id="password" type="password" placeholder="비밀번호를 입력하세요">
                                <div class="input-text-show">
                                    <div class="btn-eye-close btn"><img src="img/icon-eyes-close.svg" alt=""></div>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn_large btn_login">로그인</button>
                    </form>
                </div>
                <div class="quick-login">
                    <span class="quick-login-title">간편 로그인하기</span>
                    <div class="quick-login-button">
                        <a href="https://www.google.com/"><img src="img/logo-small-google.svg" alt=""></a>
                        <a href="https://www.kakaocorp.com/page/"><img src="img/logo-small-kakao.svg" alt=""></a>
                    </div>
                </div>
                <p class="line-join">판다마켓이 처음이신가요? <a href="signup.html" class="btn">회원가입</a></p>
            </div>
        </div>
    </div>
</body>

</html>
