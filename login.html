<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 로그인</title>
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-all">
      <a class="logo" href="/">
        <img src="./images/logo_panda.svg" />
        <p>판다마켓</p>
      </a>

      <div class="login-main">
        <form>
          <fieldset class="input_box">
            <label for="useremail">이메일</label>
            <input
              id="useremail"
              class="input"
              placeholder="이메일을 입력해주세요."
              name="email"
              type="email"
              autocomplete="off"
              required
            />
          </fieldset>
          <fieldset>
            <label for="password">비밀번호</label>
            <div class="password_box">
              <input
                id="password"
                class="input"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요."
                required
              />
              <img src="./images/login/password_close_eye_btn.svg" />
            </div>
          </fieldset>
          <button type="submit">로그인</button>
        </form>

        <div class="simple-login">
          <div class="simple-login-text_app">
            <p>간편 로그인하기</p>
            <div class="app-logo">
              <a href="https://www.google.com/"
                ><img src="./images/login/ic_google.svg"
              /></a>
              <a href="https://www.kakaocorp.com/page/"
                ><img src="./images/login/ic_kakaotalk.svg"
              /></a>
            </div>
          </div>
        </div>

        <div class="sign-up">
          <p>판다마켓이 처음이신가요?</p>
          <a href="signup.html" alt="sign-up">회원가입</a>
        </div>
      </div>
    </div>
  </body>
</html>
