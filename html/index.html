<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/indexstyle.css" />
  </head>

  <body>
    <div class="header">
      <div class="header-inner">
        <a class="logo" href="index.html">
          <!--판마마켓 로고 클릭 시 홈 화면 -->
          <img src="../images/logo.png" alt="판다 로고" /><span>판다마켓</span>
          <!-- 판다 로고 -->
        </a>
        <a class="login-btn" href='login.html'>로그인</a>
      </div>
    </div>

    <div class="panda-top-main">
      <div class="panda-inner">
        <div class="panda-text">
          일상의 모든 물건을<br />
          거래해 보세요
        </div>
        <a href="item.html" class="panda-button">구경하러 가기</a>
      </div>

      <img class="panda-image" src="../images/panda.png" alt="판다 이미지" />
    </div>

    <div class="features">
      <section class="card">
        <div class="card-image">
          <img src="../images/card1.png" alt="인기 상품 이미지" />
        </div>
        <header class="card-text">
          <h2 class="card-abbreviation">Hot item</h2>
          <h2 class="card-title">
            인기 상품을<br />
            확인해 보세요
          </h2>
          <h2 class="card-desc">
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </h2>
        </header>
      </section>

      <div class="card">
        <section class="card-text">
          <h2 class="card-abbreviation">Search</h2>
          <h2 class="card-title">구매를 원하는<br />상품을 검색하세요</h2>
          <h2 class="card-desc">
            구매하고 싶은 물품은 검색으로<br />쉽게 찾아보세요
          </h2>
        </section>
        <div class="card-image">
          <img src="../images/card2.png" alt="검색 이미지" />
        </div>
      </div>

      <div class="card">
        <div class="card-image">
          <img src="../images/card3.png" alt="상품 등록 이미지" />
        </div>
        <div class="card-text">
          <h2 class="card-abbreviation">Register</h2>
          <h2 class="card-title">판매를 원하는<br />상품을 등록하세요</h2>
          <h2 class="card-desc">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </h2>
        </div>
      </div>
    </div>

    <div class="bottom-banner">
      <div class="bottom-inner">
        <h2 class="bottom-text">믿을 수 있는 판다마켓 중고 거래</h2>
        <div class="bottom-image">
          <img src="../images/bottom.png" alt="판다 두 마리 이미지" />
        </div>
      </div>
    </div>
    <div class="bottom-last"></div>
  </body>
</html>
