<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/loginstyle.css" />
    <title>로그인</title>
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <!-- 로고 -->
        <header class="login-header">
          <img src="../images/logo.png" alt="판다마켓 로고" class="logo-icon" />
          <a href="../html/index.html">
            <h1 class="logo-text">판다마켓</h1>
          </a>
        </header>

        <!-- 로그인 폼 -->
        <form class="login-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              placeholder="이메일을 입력해 주세요"
            />
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              placeholder="비밀번호를 입력해 주세요"
            />
          </div>

          <button type="submit" class="login-button">로그인</button>

          <div class="social-login">
            <span class="social-title">간편 로그인하기</span>

            <div class="social-icons">
              <a
                href="https://www.google.com/"
                target="_blank"
                class="social-icon google"
              >
                <img src="../images/google.png" alt="구글 로그인" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                class="social-icon kakao"
              >
                <img src="../images/kakao.png" alt="카카오 로그인" />
              </a>
            </div>
          </div>
        </form>

        <!-- 회원가입 -->
        <p class="signup-text">
          판다마켓이 처음이신가요?
          <a href="../html/signup.html">회원가입</a>
        </p>
      </section>
    </main>
  </body>
</html>
