<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/sprint-mission1.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <!-- 이미지 버튼 요소 삽입은 input 태그의 image 속성 그리고 src 속성 -->
    <div class="gnb">
      <a href="/"
        ><input
          type="image"
          class="pandamarket-logo"
          src="/assets/Property 1=sm.png"
      /></a>
      <a href="/login">
        <input type="image" class="login-btn" src="/assets/btn_small_48.png" />
      </a>
    </div>
    <div class="flex-container1">
      <div class="item-1">
        <div class="comment-top">일상의 모든 물건을<br />거래해 보세요</div>
        <a href="/items">
          <input type="image" class="lookat-btn" src="/assets/btn_large.png" />
        </a>
      </div>
      <img class="item-2" src="/assets/Img_home_top.png" />
    </div>
    <div class="detail-page">
      <img class="first-section" src="/assets/desktop_02.png" />
      <img class="second-section" src="/assets/desktop_03.png" />
      <img class="third-section" src="assets/desktop_04.png" />
    </div>
    <div class="flex-container2">
      <div class="comment-bottom">믿을 수 있는<br />판다마켓 중고 거래</div>
      <img class="comment-bottom-img" src="/assets/Img_home_bottom.png" />
    </div>
    <div class="footer">
      <div class="footer-text">
        <div class="codeit">@codeit - 2024</div>
        <div class="middle">
          <a href="/privacy" class="privacy">Privacy Policy</a>
          <a href="/faq" class="faq">FAQ</a>
        </div>
      </div>
      <div class="footer-icon">
        <a href="https://www.facebook.com" target="_blank">
          <input type="image" class="facebook" src="/assets/ic_facebook.png" />
        </a>
        <a href="https://x.com/" target="_blank">
          <input type="image" class="twitter" src="/assets/ic_twitter.png" />
        </a>
        <a href="https://www.youtube.com/" target="_blank">
          <input type="image" class="youtube" src="/assets/ic_youtube.png" />
        </a>
        <a href="https://www.instagram.com/" target="_blank">
          <input type="image" class="insta" src="/assets/ic_instagram.png" />
        </a>
      </div>
    </div>
  </body>
</html>
