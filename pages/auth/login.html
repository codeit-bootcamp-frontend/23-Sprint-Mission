<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="./auth.css" />
  </head>
  <body>
    <main>
      <section class="auth-header">
        <a href="/">
          <img src="/assets/images/logo.svg" alt="판다마켓 로고" class="logo" />
        </a>
      </section>
      <section class="auth-body">
        <div class="auth-form">
          <div class="auth-form-input-wrapper">
            <label for="login-email">이메일</label>
            <input id="login-email" class="auth-form-input" type="email" />
            <span class="error-message" id="login-email-error"></span>
          </div>
          <div class="auth-form-input-wrapper">
            <label for="login-password">비밀번호</label>
            <div class="auth-form-input-container">
              <input
                id="login-password"
                class="auth-form-input"
                type="password"
              />
              <button
                type="button"
                class="auth-form-input-icon password-toggle"
              >
                <img src="/assets/icons/btn-visibility-on.svg" alt="보기" />
              </button>
            </div>
            <span class="error-message" id="login-password-error"></span>
          </div>
          <button type="submit" class="auth-button" id="login-button" disabled>
            로그인
          </button>
          <div class="login-social">
            <div class="login-social-label">간편 로그인하기</div>
            <div class="login-social-buttons">
              <a
                href="https://www.google.com"
                target="_blank"
                class="login-social-btn login-social-btn--google"
              >
                <img
                  src="../../assets/icons/google-icon.svg"
                  alt="구글"
                  class="login-social-icon"
                />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                class="login-social-btn login-social-btn--kakao"
              >
                <img
                  src="../../assets/icons/kakaotalk-icon.svg"
                  alt="카카오"
                  class="login-social-icon"
                />
              </a>
            </div>
          </div>
          <span class="signup-message">
            판다마켓이 처음이신가요?
            <a href="/pages/auth/signup.html">회원가입</a>
          </span>
        </div>
      </section>
    </main>
    <script type="module" src="../../scripts/auth/login.js"></script>
  </body>
</html>
