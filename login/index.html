<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/login/style.css" />
    <link rel="stylesheet" href="/global.css" />
    <title>로그인 | 판다마켓</title>
  </head>

  <body>
    <div class="wrapper">
      <header class="top-header">
        <img src="/images/logo.svg" alt="판다마켓 로고" />
        <a href="/">
          <h1 class="logo-name">판다마켓</h1>
        </a>
      </header>
      <main>
        <form>
          <div class="login-input">
            <label class="label-input" for="id">이메일</label>
            <div id="id-container" class="login-container">
              <input
                class="id-input"
                type="email"
                id="id"
                placeholder="이메일을 입력해주세요"
                autocomplete="username"
              />
            </div>
            <p class="error-message"></p>
          </div>
          <div class="login-input">
            <label class="label-input" for="password">비밀번호</label>
            <div id="password-container" class="login-container">
              <input
                class="password-input"
                type="password"
                id="password"
                placeholder="비밀번호를 입력해주세요"
                autocomplete="current-password"
              />
              <button class="password-blink" type="button">
                <img src="/images/non-blink.svg" />
              </button>
            </div>
            <p class="error-message"></p>
          </div>
          <button class="login-button" type="submit" disabled>로그인</button>
        </form>
        <div class="easy-login-container">
          <div>간편 로그인하기</div>
          <div class="icon-container">
            <a href="https://www.google.com/" target="_blank"
              ><img class="icon" src="/images/google.svg" alt="구글 아이콘"
            /></a>
            <a href="https://www.kakaocorp.com/page/" target="_blank"
              ><img
                class="icon"
                src="/images/kakaologo.svg"
                alt="카카오 아이콘"
            /></a>
          </div>
        </div>
      </main>
      <footer class="final-footer">
        <p>판다마켓이 처음이신가요? <a href="/signup/">회원가입</a></p>
      </footer>
    </div>
    <script src="./login.js"></script>
  </body>
</html>
