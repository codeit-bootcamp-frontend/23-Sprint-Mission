<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>판다마켓 | 로그인</title>
  </head>
  <body>
    <div class="auth-container">
      <a href="/">
        <img src="/images/logo.svg" alt="판다마켓 로고" class="auth-logo" />
      </a>

      <form class="auth-form" action="/">
        <div>
          <label for="email" class="text-2lg bold secondary-800 auth-label">
            이메일
          </label>
          <input
            id="email"
            type="email"
            name="email"
            class="input w-full"
            placeholder="이메일을 입력해주세요."
            autocomplete="off"
            required
          />
        </div>
        <div>
          <label for="password" class="text-2lg bold secondary-800 auth-label">
            비밀번호
          </label>
          <div class="relative">
            <input
              id="password"
              class="input w-full"
              type="password"
              name="password"
              placeholder="비밀번호를 입력해주세요."
              required
            />

            <img
              src="/images/icon/eyes.svg"
              alt="비밀번호 표시"
              class="eyes secondary-600"
            />
          </div>
        </div>
        <button
          class="btn-large bg-primary-100 secondary-50 hover:bg-primary-200 w-full semibold text-xl"
          type="submit"
        >
          로그인
        </button>
      </form>
      <!-- OAuth -->
      <div class="oauth-container">
        <p class="medium text-lg">간편 로그인하기</p>

        <div class="flex gap-4">
          <a href="http://google.com" target="_blank">
            <img src="/images/icon/google.svg" alt="구글" />
          </a>
          <a href="https://www.kakaocorp.com/page/" target="_blank">
            <img src="/images/icon/kakaotalk.svg" alt="카카오톡" />
          </a>
        </div>
      </div>
      <p class="text-md medium secondary-800">
        판다마켓이 처음이신가요?
        <a href="/signup" class="primary-100 underline">회원가입</a>
      </p>
    </div>
  </body>
</html>
