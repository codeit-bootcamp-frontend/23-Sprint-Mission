<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/signup/style.css" />
    <link rel="stylesheet" href="/global.css" />

    <title>회원가입 | 판다마켓</title>
  </head>

  <body>
    <div class="wrapper">
      <header class="top-header">
        <img src="/images/logo.svg" alt="판다마켓 로고" />
        <a href="/">
          <h1 class="logo-name">판다마켓</h1>
        </a>
      </header>
      <main>
        <form>
          <div class="signup-input">
            <label class="label-input" for="id">이메일</label>
            <div class="signup-container">
              <input
                class="id-input"
                type="email"
                id="id"
                placeholder="이메일을 입력해주세요"
              />
            </div>
            <p class="error-message"></p>
          </div>
          <div class="signup-input">
            <label class="label-input" for="nickname">닉네임</label>
            <div class="signup-container">
              <input
                class="id-input"
                id="nickname"
                placeholder="닉네임을 입력해주세요"
              />
            </div>
            <p class="error-message"></p>
          </div>
          <div class="signup-input">
            <label class="label-input" for="password">비밀번호</label>
            <div class="signup-container">
              <input
                class="password-input"
                type="password"
                id="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <button class="password-blink" type="button">
                <img src="/images/non-blink.svg" alt="보임 이모지" />
              </button>
            </div>
            <p class="error-message"></p>
          </div>
          <div class="signup-input">
            <label class="label-input" for="password-accept"
              >비밀번호 확인</label
            >
            <div class="signup-container">
              <input
                class="password-input"
                type="password"
                id="password-accept"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <button class="password-blink" type="button">
                <img src="/images/non-blink.svg" alt="보임 이모지" />
              </button>
            </div>
            <p class="error-message"></p>
          </div>

          <button class="signup-button" type="submit" disabled>회원가입</button>
        </form>
        <div class="easy-signup-container">
          <div>간편 로그인하기</div>
          <div class="icon-container">
            <a href="https://www.google.com/" target="_blank"
              ><img class="icon" src="/images/google.svg" alt="구글 아이콘"
            /></a>
            <a href="https://www.kakaocorp.com/page/" target="_blank"
              ><img
                class="icon"
                src="/images/kakaologo.svg"
                alt="카카오 아이콘"
            /></a>
          </div>
        </div>
      </main>
      <footer class="final-footer">
        <p>이미 회원이신가요? <a href="/login/">로그인</a></p>
      </footer>
    </div>
    <script src="./signup.js"></script>
  </body>
</html>
