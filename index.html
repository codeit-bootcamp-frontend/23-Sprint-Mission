<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="index.css">
        <title>판다마켓</title>
        <!-- 랜딩 페이지의 url path는 루트('/')로 설정합니다.
title은 "판다마켓"로 설정합니다.
클릭으로 기능이 동작해야 하는 경우, 사용자가 클릭할 수 있는 요소임을 알 수 있도록 CSS 속성 cursor: pointer 로 설정합니다.
"판다마켓" 클릭 시 루트 페이지('/')로 이동합니다.
'로그인'버튼 클릭 시 로그인 페이지('/login')로 이동합니다 (빈 페이지)
"구경하러가기"버튼 클릭 시('/items')로 이동합니다.(빈 페이지) -->
    </head>
    <body>
        <header>
            <div id="head">
                <a href="/">
                <img id="logo" src="images/Property 1=lg.png"></a>
                <a href="/login"><button id="login-btn">로그인</button></a>
            </div>
        </header>
        <main id="main1">
            <div id="pandaHi">
                <div>
                    <p>일상의 모든 물건을<br> 거래해 보세요</p>
                    <a href="/items"></a><button id="go">구경하러 가기</button>
                </div>
            <img src="/images/Img_home_top.svg">
        </div>
        </main>
        <main id="main2">
            <div class="main-box">
                <img src="/images/Frame 2608833.svg">
                <div class="text-box">
                    <p class="subtitle">Hot items</p>
                    <p class="title">인기 상품을<br> 확인해 보세요</p>
                    <p class="content">가장 HOT한 중고거래 물품을<br> 판다 마켓에서 확인해 보세요</p>
                </div>
            </div>
        </main>
        <main id="main3">
            <div class="main-box">
                <div class="text-box" id="align">
                    <p class="subtitle">Search</p>
                    <p class="title">구매를 원하는<br> 상품을 검색하세요</p>
                    <p class="content">구매하고 싶은 물품은 검색해서<br> 쉽게 찾아보세요</p>
                </div>
                <img src="/images/Img_home_02.png">
            </div>
        </main>
        <main id="main4">
            <div class="main-box">
                <div class="text-box">
                    <p class="subtitle">Register</p>
                    <p class="title">판매를 원하는 <br> 상품을 검색하세요</p>
                    <p class="content">어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
                </div>
                <img src="/images/Group 33682.png">
            </div>
        </main>
        <main id="main5">
            <div id="pandaBye">
                <p>믿을 수 있는 <br> 판다마켓 중고거래</p>
                <img src="/images/Group 33695.png">
            </div>
        </main>
        <footer>
            <img src="/images/Frame 33707.png">
    </body>
</html>
