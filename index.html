<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://sprintmission-yjw-pandamarket.netlify.app/"
    />
    <meta
      property="og:image"
      content="https://sprintmission-yjw-pandamarket.netlify.app/images/preview.png"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="global.css" />
  </head>

  <body>
    <header>
      <nav>
        <div class="header-content">
          <a href="/">
            <img src="images/logo.svg" alt="판다마켓 로고" />
          </a>
          <a class="login-button" href="login.html">로그인</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="landing-header">
        <div class="section-content">
          <div class="text-btn">
            <h1>일상의 모든 물건을 거래해보세요</h1>
            <a href="/items">구경하러 가기</a>
          </div>

          <img src="images/landing-content-header.svg" />
        </div>
      </section>

      <div class="landing-body">
        <section class="landing-section">
          <img src="images/landing-section-1.svg" />
          <div class="landing-section-content w-288">
            <span>Hot item</span>
            <div class="w-288">
              <h2>인기 상품을 확인해 보세요</h2>
              <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
            </div>
          </div>
        </section>

        <section class="landing-section reverse">
          <div class="landing-section-content w-317 text-right">
            <span>Search</span>
            <div>
              <h2>구매를 원하는 상품을 검색하세요</h2>
              <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
            </div>
          </div>
          <img src="images/landing-section-2.svg" />
        </section>

        <section class="landing-section">
          <img src="images/landing-section-3.svg" />
          <div class="landing-section-content w-359">
            <span>Register</span>
            <div class="w-359">
              <h2>판매를 원하는 상품을 등록하세요</h2>
              <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
            </div>
          </div>
        </section>

        <div class="landing-footer">
          <div class="landing-content-footer">
            <h2>믿을 수 있는 판다마켓 중고 거래</h2>
            <img src="images/landing-content-footer.svg" />
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-content">
        <img src="images/codeit_text.svg" />
        <div class="Pricy_FAQ">
          <a href="/pricy">
            <span>Pricy Policy</span>
          </a>
          <a href="faq">
            <img src="images/FAQ.svg" />
          </a>
        </div>
        <div class="icon">
          <a href="https://www.facebook.com" target="_blank">
            <img src="images/ic_img/ic_facebook.svg" alt="페이스북" />
          </a>

          <a href="https://www.twitter.com" target="_blank">
            <img src="images/ic_img/ic_twitter.svg" alt="트위터" />
          </a>

          <a href="https://www.youtube.com" target="_blank">
            <img src="images/ic_img/ic_youtube.svg" alt="유튜브" />
          </a>

          <a href="https://www.instagram.com" target="_blank">
            <img src="images/ic_img/ic_instagram.svg" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
