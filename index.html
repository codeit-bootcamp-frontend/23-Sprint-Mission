<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 페이스북 -->
    <meta property="og:image" content="../images/metaTag_main_logo2.png" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <!-- 트위터 -->
    <meta name="twitter:card" content="../images/metaTag_main_logo2.png" />
    <meta name="twitter:image" content="../images/metaTag_main_logo2.png" />
    <meta name="twitter:title" content="판다마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />

    <title>판다마켓</title>
    <link rel="stylesheet" href="/styles/index.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header_bar">
      <div class="head">
        <div class="logo">
          <img src="/images/logo_panda.svg" alt="판다마켓 로고" />
          <a href="/">판다마켓</a>
        </div>
        <a href="login.html"><div class="log_in">로그인</div></a>
      </div>
    </header>

    <main>
      <div class="main_container container">
        <div class="main_content text_image">
          <div class="main_write_button">
            <h1>일상의 모든 물건을 거래해 보세요</h1>
            <button href="/items">구경하러 가기</button>
          </div>
          <img src="/images/main_top_panda.svg" alt="" />
        </div>
      </div>

      <div class="all-section">
        <section class="section1 section">
          <div class="content1 content">
            <img src="/images/main_hot_item.svg" alt="" />
            <div class="text1">
              <h2 class="subtitle">Hot item</h2>
              <div class="main_text1">
                <h2>인기 상품을 확인해 보세요</h2>
                <p>
                  가장 Hot한 중고거래 물품을<br />판다 마켓에서 확인해보세요
                </p>
              </div>
            </div>
          </div>
        </section>

        <section class="section2 section">
          <div class="content2 content">
            <img src="/images/main_search.svg" alt="" />
            <div class="text1">
              <h2 class="subtitle">search</h2>
              <div class="main_text1">
                <h2>구매를 원하는 상품을 검색하세요</h2>
                <p>구매하고 싶은 물품을 검색해서<br />쉽게 찾아보세요</p>
              </div>
            </div>
          </div>
        </section>

        <section class="section3 section">
          <div class="content3 content">
            <img src="/images/main_register.svg" alt="섹션1_판다_이미지" />
            <div class="text1">
              <h2 class="subtitle">Register</h2>
              <div class="main_text1">
                <h2>판매를 원하는 상품을 등록하세요</h2>
                <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="buttom_container container">
        <div class="buttom_content text_image">
          <div class="buttom_write">
            <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
          <img src="/images/main_bottom_panda.svg" alt="홈화면_판다_이미지" />
        </div>
      </div>
    </main>

    <footer>
      <div class="footer">
        <p>©codeit - 2024</p>
        <div class="FAQ">
          <a href="/privacy"><p>Privacy Policy</p></a>
          <a href="/faq"><p>FAQ</p></a>
        </div>
        <div class="icons">
          <a href="https://www.facebook.com/"
            ><img src="/images/ic_facebook.svg" alt="페이스북_아이콘"
          /></a>
          <a href="https://x.com/"
            ><img src="/images/ic_twitter.svg" alt="트위터_아이콘"
          /></a>
          <a href="https://www.youtube.com/"
            ><img src="/images/ic_youtube.svg" alt="유튜브_아이콘"
          /></a>
          <a href="https://www.instagram.com/"
            ><img src="/images/ic_instagram.svg" alt="인스타그램_아이콘"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
