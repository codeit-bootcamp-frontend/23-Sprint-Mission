<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/index.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="header-container">
      <div class="header-inner">
        <a href="/index.html">
          <img src="img/logo_img.svg" class="header-logo-img" alt="" />
        </a>
        <a href="login.html" class="header-login-btn">로그인</a>
      </div>
    </header>

    <section class="section-top">
      <div class="section-top-inner">
        <div class="section-top-inner-left">
          <h1>일상의 모든 물건을 거래해 보세요</h1>
          <a href="items.html">구경하러 가기</a>
        </div>
        <img src="./img/banners/top_img.svg" alt="" />
      </div>
    </section>

    <main class="main">
      <section class="section-main">
        <div class="section-main-inner">
          <img src="./img/features/feature_img1.svg" />
          <div class="section-main-inner-right">
            <span class="section-span">Hot item</span>
            <h2>인기상품을 확인해보세요</h2>
            <p>
              가장 HOT한 중고거래 물품을 <br />
              판다 마켓에서 확인해보세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-main">
        <div class="section-main-inner reverse">
          <img src="./img/features/feature_img2.svg" alt="" />
          <div class="section-main-inner-right">
            <span class="section-span">Search</span>
            <h2>
              구매를 원하는 상품을<br />
              검색하세요
            </h2>
            <p>
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-main">
        <div class="section-main-inner">
          <img src="./img/features/feature_img3.svg" alt="" />
          <div class="section-main-inner-right">
            <span class="section-span">Hot item</span>
            <h2>판매를 원하는 상품을 등록하세요</h2>
            <p>
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="section-bottom">
        <div class="section-bottom-inner">
          <h2>
            믿을 수 있는 <br />
            판다마켓 중고 거래
          </h2>
          <img src="./img/banners/bottom_img.svg" alt="" />
        </div>
      </section>
    </main>

    <footer class="footer-container">
      <div class="footer-inner">
        <span class="footer-inner-left">@codeit - 2024</span>
        <div class="footer-inner-center">
          <a href="privacy.html">
            <span>Privacy Policy</span>
          </a>
          <a href="faq.html">
            <span>FAQ</span>
          </a>
        </div>
        <ul class="footer-inner-right">
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img src="./img/icons/ic_facebook.svg" alt="페이스북 바로가기" />
            </a>
          </li>

          <li>
            <a href="https://www.twitter.com/" target="_blank">
              <img src="./img/icons/ic_twitter.svg" alt="트위터 바로가기" />
            </a>
          </li>

          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="./img/icons/ic_youtube.svg" alt="유튜브 바로가기" />
            </a>
          </li>

          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img
                src="./img/icons/ic_instagram.svg"
                alt="인스타그램 바로가기"
              />
            </a>
          </li>
        </ul>
      </div>
    </footer>

</html>
