<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:image" content="assets/info1.svg" />
    <meta property="og:url" content="/" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" href="styles/global.css" type="text/css" />
    <link rel="stylesheet" href="styles/index.css" type="text/css" />
    <title>판다마켓</title>
  </head>
  <body>
    <nav id="header">
      <a href="/">
        <img
          src="assets/logo.svg"
          class="logoImg"
          width="153px"
          height="51px"
          alt="logo"
        />
      </a>
      <a href="/login.html" id="loginBtn" class="button">로그인</a>
    </nav>

    <section class="landingBanner">
      <div class="landingContents">
        <h1 class="landingHeader">
          일상의 모든 물건을<br />
          거래해 보세요
        </h1>
        <a href="/items.html" id="landingBtn" class="button">구경하러 가기</a>
      </div>
    </section>

    <div class="infos">
      <section class="infoItem">
        <img src="assets/info1.svg" alt="info1" width="579px" height="444px" />
        <div class="infoContent">
          <span class="itemHeader">Hot Item</span>
          <h2>인기 상품을<br />확인해 보세요</h2>
          <p>가장 HOT한 중고거래 물픔을 <br />판다 마켓에서 확인해 보세요</p>
        </div>
      </section>

      <section class="infoItem">
        <div class="infoContent left">
          <span class="itemHeader">Search</span>
          <h2>구매를 원하는 상품을 검색하세요</h2>
          <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
        </div>
        <img src="assets/info2.svg" alt="info2" width="579px" height="444px" />
      </section>

      <section class="infoItem">
        <img src="assets/info3.svg" alt="info3" width="579px" height="444px" />
        <div class="infoContent">
          <span class="itemHeader">Register</span>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
        </div>
      </section>
    </div>

    <div class="line"></div>

    <section class="footerBanner">
      <h2 class="footerBannerContent">
        믿을 수 있는 <br />
        판다마켓 중고 거래
      </h2>
    </section>

    <footer id="footer">
      <span>@codeit-2025</span>
      <div id="footerNav">
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/faq.html">FAQ</a>
      </div>
      <ul id="logos">
        <li>
          <a href="https://www.facebook.com" target="_blank">
            <img
              src="assets/snslogos/fblogo.svg"
              alt="facebooklogo"
              width="20px"
              height="20px"
            />
          </a>
        </li>
        <li>
          <a href="https://x.com" target="_blank">
            <img
              src="assets/snslogos/twlogo.svg"
              alt="twitterlogo"
              width="20px"
              height="20px"
            />
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com" target="_blank">
            <img
              src="assets/snslogos/ytlogo.svg"
              alt="youtubelogo"
              width="20px"
              height="20px"
            />
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com" target="_blank">
            <img
              src="assets/snslogos/inlogo.svg"
              alt="instagramlogo"
              width="20px"
              height="20px"
            />
          </a>
        </li>
      </ul>
    </footer>
  </body>
</html>
