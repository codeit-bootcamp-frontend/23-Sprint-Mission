<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
    <title>판다마켓</title>
</head>
<body>
    <nav id="nav">
        <div class="nav-container">
            <img src="img/logo.png" id="logo" alt="로고">
            <a href="login.html">
                <button type="button" id="login_btn">로그인</button>
            </a>
        </div>
    </nav>

    <header id="hero">
        <div class="hero-container">
            <div class="hero-text">
                <h1>일상의 모든 물건을<br>거래해 보세요</h1>
                <a href="/items.html">
                    <button type="button" class="hero-btn">구경하러 가기</button>
                </a>
            </div>
            <img src="img/img1.png" class="hero-img" alt="메인 이미지">
        </div>
    </header>

    <section class="feature-section white-bg">
        <div class="feature-container">
            <img src="img/img2.png" class="feature-img" alt="인기 상품">
            <div class="feature-text">
                <span class="label">Hot Item</span>
                <h2>인기 상품을<br>확인해 보세요</h2>
                <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
            </div>
        </div>
    </section>

    <section class="feature-section white-bg">
        <div class="feature-container reverse-text">
            <div class="feature-text align-right">
                <span class="label">Search</span>
                <h2>구매를 원하는<br>상품을 검색하세요</h2>
                <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
            </div>
            <img src="img/img4.png" class="feature-img" alt="검색">
        </div>
    </section>

    <section class="feature-section white-bg">
        <div class="feature-container">
            <img src="img/img4.png" class="feature-img" alt="등록">
            <div class="feature-text">
                <span class="label">Register</span>
                <h2>판매를 원하는<br>상품을 등록하세요</h2>
                <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
            </div>
        </div>
    </section>

    <section class="banner-section">
        <div class="banner-container">
            <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
            <img src="img/img5.png" alt="판다 캐릭터">
        </div>
    </section>

    <section class="bottom">
        <div class="bottom_box">
            <div class="box_1">
                <span>©codeit - 2024</span>
            </div>
            <div class="box_2">
                <span>Privacy Policy</span>
                <a href="/">FAQ</a>
            </div>
            <div class="box_3">
                <img src="img/ic_facebook.png" alt="facebook">
                <img src="img/ic_instagram.png" alt="instagram">
                <img src="img/ic_twitter.png" alt="twitter">
                <img src="img/ic_youtube.png" alt="youtube">
            </div>
        </div>
    </section>
</body>
</html>
