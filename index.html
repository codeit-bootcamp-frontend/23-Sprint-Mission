<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Open Graph-->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:image" content="img/main/hero_img.png" />
    <meta property="og:url" content="https://23-sprint-mission.netlify.app/" />
    <!--twitter-->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta name="twitter:image" content="img/main/hero_img.png" />

    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="style/main.css" />
  </head>
  <body>
    <!--header-->
    <header class="header">
      <a href="./" class="header_logo">
        <img src="img/logo/logo_face.svg" alt="logo_face" />
        <img src="img/logo/logo_text.svg" alt="logo_text" />
      </a>
      <a href="./login.html " class="main-login_btn btn">로그인</a>
    </header>
    <main class="without_header">
      <!--hero_section-->
      <section class="hero_section">
        <div class="hero_section_inner">
          <div class="hero_text">
            <h1 class="title">일상의 모든 물건을 거래해 보세요</h1>
            <a href="./items.html" class="hero_btn btn">구경하러 가기</a>
          </div>
          <img src="img/main/hero_img.png" alt="hero_image" class="hero_img" />
        </div>
      </section>
      <section class="features_section">
        <!--feature01-->
        <div class="feature">
          <img
            src="img/main/section_01.png"
            alt="section_01"
            class="feature_img"
          />
          <div class="feature_text">
            <span class="feature_theme">Hot Item</span>
            <h2 class="feature_title">
              인기 상품을<br class="line_break" />확인해 보세요
            </h2>
            <p class="feature_info">
              가장 HOT한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <!--feature02-->
        <div class="feature feature--reverse">
          <img
            src="img/main/section_02.png"
            alt="section_02"
            class="feature_img"
          />
          <div class="feature_text feature_text--left">
            <span class="feature_theme">Search</span>
            <h2 class="feature_title">
              구매를 원하는<br class="line_break" />상품을 검색하세요
            </h2>
            <p class="feature_info">
              구매하고 싶은 물품을 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
        <!--feature03-->
        <div class="feature">
          <img
            src="img/main/section_03.png"
            alt="section_03"
            class="feature_img"
          />
          <div class="feature_text">
            <span class="feature_theme">Register</span>
            <h2 class="feature_title">
              판매를 원하는<br class="line_break" />상품을 등록하세요
            </h2>
            <p class="feature_info">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <!--footer_hero_section-->
      <section class="hero_section">
        <div class="hero_section_inner">
          <div class="hero_text">
            <h1 class="title">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </h1>
          </div>
          <img
            src="img/main/hero_footer_img.png"
            alt="hero_image"
            class="hero_img"
          />
        </div>
      </section>
    </main>
    <!--footer-->
    <footer class="footer">
      <div class="footer_inner">
        <div class="footer_content footer_content--copyright">
          &copy;codeit - 2024
        </div>
        <ul class="footer_content footer_content--links">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/faq">FAQ</a></li>
        </ul>
        <ul class="footer_content footer_content--sns">
          <li>
            <a href="https://www.facebook.com/?locale=ko_KR">
              <img src="img/sns_icon/facebook_icon.svg" alt="facebook_icon" />
            </a>
          </li>
          <li>
            <a href="https://x.com/?lang=ko ">
              <img src="img/sns_icon/twitter_icon.svg" alt="twitter_icon" />
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/">
              <img src="img/sns_icon/youtube_icon.svg" alt="youtube_icon" />
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/">
              <img src="img/sns_icon/instagram_icon.svg" alt="instagram_icon" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
