<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon -->
    <link rel="icon" href="img/favicon.ico" />
    <!-- CSS Files(global, index) -->
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="gnb">
      <div class="gnb-container">
        <a href="/">
          <img class="pandaLogo" src="img/logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="loginBtn" href="login.html">로그인</a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-contents">
          <div class="hero-left">
            <div class="hero-text">
              일상의 모든 물건을<br />
              거래해 보세요
            </div>
            <a class="hero-btn" href="items.html">구경하러 가기</a>
          </div>
          <div class="hero-right">
            <img
              class="hero-img"
              src="img/Img_home_top.svg"
              alt="구경하러 가기 이미지"
            />
          </div>
        </div>
      </section>
      <section class="item">
        <div class="item-box">
          <div class="item-row">
            <img src="img/Img_home_01.svg" alt="인기 상품 확인 이미지" />
            <div class="item-text">
              <div class="cata">Hot item</div>
              <div class="title">인기 상품을<br />확인해 보세요</div>
              <div class="detail">
                가장 HOT한 중고거래 물품을<br />
                판다 마켓에서 확인해 보세요
              </div>
            </div>
          </div>

          <div class="item-row">
            <div class="item-text">
              <div class="cata">Search</div>
              <div class="title">구매를 원하는<br />상품을 검색하세요</div>
              <div class="detail">
                구매하고 싶은 물품은 검색해서 <br />
                쉽게 찾아보세요
              </div>
            </div>
            <img src="img/Img_home_02.svg" alt="상품 검색 이미지" />
          </div>

          <div class="item-row">
            <img src="img/Img_home_03.svg" alt="판매 등록 이미지" />
            <div class="item-text">
              <div class="cata">Register</div>
              <div class="title">판매를 원하는<br />상품을 등록하세요</div>
              <div class="detail">
                어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="cta">
        <div class="cta-contents">
          <div class="cta-left">
            <div class="cta-text">믿을 수 있는<br />판다마켓 중고 거래</div>
          </div>
          <div class="cta-right">
              <img class="cta-img"
                src="img/Img_home_bottom.svg"
                alt="판다마켓 중고 거래 이미지"
              />
            </div>
          </div>
        </div>
      </section>
      <footer class="footer">
        <div class="footer-contents">
          <div class="footer-left">©codeit - 2024</div>
          <div class="footer-center">
            <a href="privacy.html">Privacy Policy</a>
            <a href="faq.html">FAQ</a>
          </div>
          <div class="footer-right">
            <a class="ic_facebook" href="https://www.facebook.com" target="_blank"><img src="img/ic_facebook.svg" alt="페이스북 아이콘"></a>
            <a class="ic_x" href="https://x.com/" target="_blank"><img src="img/ic_twitter.svg" alt="트위터 아이콘"></a>
            <a class="ic_youtube" href="https://www.youtube.com/" target="_blank"><img src="img/ic_youtube.svg" alt="유튜브 아이콘"></a>
            <a class="ic_insta" href="https://www.instagram.com/" target="_blank"><img src="img/ic_instagram.svg" alt="인스타그램 아이콘"></a>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
