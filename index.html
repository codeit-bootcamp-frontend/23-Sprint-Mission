<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>판다마켓</title>
        <link
            rel="stylesheet"
            as="style"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="styles/index.css">
    </head>
    <body>
        <header class="gnb">
            <nav>
                <a href="/">
                    <img src="images/logo/panda-market-logo.png" alt="판다마켓 로고">
                </a>
                <a href="signin.html" class="btn-small-48 login-button">
                    로그인
                </a>
            </nav>
        </header>

        <section class="banner">
            <div class="banner-content">
                <div>
                    <h1 class="banner-heading">
                        일상의 모든 물건을<br>
                        거래해 보세요
                    </h1>
                    <a class="btn-large" href="/items">구경하러 가기</a>
                </div>
                <img id="banner-image" src="images/home/hero-image.png" alt="배너이미지">
            </div>
        </section>

        <div class="landing-body">
            <section class="landing-content">
                <img src="images//home/feature1-image.png" alt="인기상품">
                <div>
                    <span>Hot item</span>
                    <h2 class="landing-heading">
                        인기 상품을<br>
                        확인해 보세요
                    </h2>
                    <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
                </div>
            </section>

            <section class="landing-content">
                <div>
                    <span>Search</span>
                    <h2 class="landing-heading">
                        구매를 원하는<br>
                        상품을 검색하세요
                    </h2>
                    <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
                </div>
                <img src="images/home/feature2-image.png" alt="상품검색">
            </section>

            <section class="landing-content">
                <img src="images/home/feature3-image.png" alt="상품등록">
                <div>
                    <span>Register</span>
                    <h2 class="landing-heading">
                        판매를 원하는<br>
                        상품을 등록하세요
                    </h2>
                    <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
                </div>
            </section>

        </div>

        <section class="landing-footer">
            <div>
                <div class="landing-footer-content">
                    <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
                </div>
                <img src="images/home/bottom-banner-image.png">
            </div>
        </section>

        <footer class="footer">
            <div class="footer-container">
                <div class="domain">
                    <p>©codeit - 2024</p>
                </div>
                <div class="faq">
                    <a href="/privacy">Privacy Policy</a>
                    <a href="/faq">FAQ</a>
                </div>
                <ul class="sns">
                    <li>
                        <a href="/facebook">
                            <img src="images/social/ic_facebook.svg" alt="페이스북">
                        </a>
                    </li>
                    <li>
                        <a href="/twitter">
                            <img src="images/social/ic_twitter.svg" alt="트위터">
                        </a>
                    </li>
                    <li>
                        <a href="/youtube">
                            <img src="images/social/ic_youtube.svg" alt="유튜브">
                        </a>
                    </li>
                    <li>
                        <a href="/instagram">
                            <img src="images/social/ic_instagram.svg" alt="인스타그램">
                        </a>
                    </li>
                </ul>
            </div>
        </footer>

    </body>
</html>
