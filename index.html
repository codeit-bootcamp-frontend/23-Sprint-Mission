<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="header-logo">
          <img src="./img/판다 얼굴.png" alt="로고" />
          <a href="/">판다마켓</a>
        </div>
        <a class="login-button" href="/login.html">로그인</a>
      </div>
    </header>

    <section class="top-section">
      <div class="top-inner">
        <div class="top-text">
          <h1>일상의 모든 물건을<br />거래해보세요</h1>
          <a href="/items.html" class="btn">구경하러 가기</a>
        </div>
        <img src="./img/Img_home_top.png" alt="메인 이미지" />
      </div>
    </section>

    <section class="main-section">
      <div class="container main-inner">
        <img src="./img/Frame 2608833.png" alt="인기 상품" />
        <div class="main-text">
          <span class="tag">Hot item</span>
          <h2 class="title-big">
            인기 상품을<br />
            확인해보세요
          </h2>
          <p class="title-small">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>

    <section class="main-section">
      <div class="container main-inner reverse">
        <img src="./img/Img_home_02.png" alt="검색" />
        <div class="main-text">
          <span class="tag">Hot item</span>
          <h2 class="title-big">
            구매를 원하는<br />
            상품을 검색하세요
          </h2>
          <p class="title-small">
            구매하고 싶은 물품은 검색해서 쉽게 찾아보세요
          </p>
        </div>
      </div>
    </section>

    <section class="main-section">
      <div class="container main-inner not-padding">
        <img src="./img/Frame 2608833.png" alt="등록" />
        <div class="main-text">
          <span class="tag">Register</span>
          <h2 class="title-big">
            판매를 원하는<br />
            상품을 등록하세요
          </h2>
          <p class="title-small">
            어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <footer>
      <div class="footer-inner">
        <p class="footer-title">
          믿을 수 있는<br />
          판다마켓 중고 거래
        </p>
        <img src="./img/Img_home_bottom.png" alt="하단 이미지" />
      </div>
    </footer>
  </body>
</html>
