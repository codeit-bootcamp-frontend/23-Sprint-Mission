<!DOCTYPE html>

    <link

    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      <nav class="nav">

        <a href="login.html" class="login" target="_self"> 로그인 </a>

    <section class="visual">
      <div class="visual-contents">
        <h1>일상의 모든 물건을<br />거래해 보세요</h1>
        <a href="items.html" class="visual-button" target="_self">

        </a>
      </div>
    </section>
    <section class="information">
      <article>
        <img src="img/Img_home_01.png" alt="인기 상품을 보는 판다 두 마리" />
        <div>
          <p class="b-title">Hot item</p>
          <h2>
            인기 상품을<br />

          <p class="description">
            가장 HOT한 중고거래 물품을<br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </article>
      <article>
        <img src="img/Img_home_02.png" alt="물음표 박스 위의 돋보기" />
        <div>
          <p class="b-title">Search</p>
          <h2>
            구매를 원하는<br />
            상품을 검색하세요
          </h2>
          <p class="description">
            구매하고 싶은 물품은<br />
            검색해서 쉽게 찾아보세요
          </p>
        </div>
      </article>
      <article>
        <img
          src="img/Img_home_03.png"
          alt="필통, 노트, 하트모양 안경 아이콘과 마술봉"
        />
        <div>
          <p class="b-title">Register</p>
          <h2>
            판매를 원하는<br />
            상품을 등록하세요
          </h2>
          <p class="description">
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </p>
        </div>
      </article>
    </section>
    <section class="visual-bottom">
      <div class="bottom-contents">
        <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
      </div>

    <footer>
      <div class="footer-wrap">

          </li>
