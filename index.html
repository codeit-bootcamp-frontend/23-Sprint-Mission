<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/main.css" />

  <body>
    <header>
      <nav class="global-navigation-bar">
        <img src="./images/logo.svg" alt="판다마켓 로고" />
        <a class="btn-small-48 login-button">로그인</a>
      </nav>
    </header>
    <main>
      <section class="landing-header">
        <div>
          <div class="landing-header-content">
            <h1 class="landing-heading">일상의 모든 물건을 거래해보세요</h1>
            <a class="btn-large landing-header-content-button">구경하러 가기</a>
          </div>
          <img
            src="./images/landing/landing-main.svg"
            alt="들판에 판다 캐릭터가 한 손을 들고 인사하는 모습"
          />
        </div>
      </section>

      <div>
        <section class="feature-section">
          <div>
            <img src="./images/landing/landing-section-1.svg" alt="" />
            <div class="feature-content w-298">
              <div class="feature-content-header">
                <span class="">Hot item</span>
                <h2 class="landing-heading">인기 상품을 확인해 보세요</h2>
              </div>
              <div class="feature-content-body">
                <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
              </div>
            </div>
          </div>
        </section>

        <section class="feature-section">
          <div class="flex-reverse">
            <img src="./images/landing/landing-section-1.svg" alt="" />
            <div class="feature-content w-293 text-right">
              <div class="feature-content-header">
                <span class="">Search</span>
                <h2 class="landing-heading">구매를 원하는 상품을 검색하세요</h2>
              </div>
              <div class="feature-content-body">
                <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
              </div>
            </div>
          </div>
        </section>

        <section class="feature-section">
          <div>
            <img src="./images/landing/landing-section-1.svg" alt="" />
            <div class="feature-content w-335">
              <div class="feature-content-header">
                <span class="">Hot item</span>
                <h2 class="landing-heading">판매를 원하는 상품을 등록하세요</h2>
              </div>
              <div class="feature-content-body">
                <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
              </div>
            </div>
          </div>
        </section>
      </div>

      <section class="landing-footer">
        <div>
          <div class="landing-footer-content">
            <h2 class="landing-heading landing-footer-heading">
              믿을 수 있는 판다마켓 중고 거래
            </h2>
          </div>
          <img
            src="./images/landing/landing-section-footer.svg"
            alt="들판에 판다 캐릭터가 한 손을 들고 인사하는 모습"
          />
        </div>
      </section>
    </main>
