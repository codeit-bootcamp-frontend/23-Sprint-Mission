<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
  <title>판다마켓</title>
</head>
<body>
  <header>
    <div class="header-container">
      <!-- logo 이미지 -->
      <div class="logo-img">
        <a href="/">
          <img src="img/logo.png" alt="logo" width="153px" height="51px" />
        </a>
      </div>
      <!-- 로그인 버튼 -->
      <a href="/login">
        <button class="login-btn">
          로그인
        </button>
      </a>
    </div>
  </header>

  <main>
    <!-- 메인 컨테이너, 헤더 밑으로 전체 영역 -->
    <div class="main-container">
      <!-- 섹션1 (백그라운드 색상적용이 필요한 영역은 따로 section~ -wrapper 클래스 추가) -->
      <div class="section-wrapper">
        <div class="section1">
          <div class="section1-inner">
            <div class="section1-block">
              <div class="section1-title">
                일상의 모든 물건을<br>
                거래해 보세요
              </div>
              <a href="/items">
                <button class="see-btn">
                  구경하러 가기
                </button>
              </a>
            </div>
            <img class="section1-img" src="img/img1.png" alt="panda" width="746px" height="340px" />
          </div>
        </div>
      </div>

      <div class="section2">
        <div class="section2-inner">
          <img class="section1-img" src="img/img2.png" alt="sec1" width="579px" height="444px" />  
          <div class="section2-block">
            <span class="section-label">Hot item</span>
            <div class="section2-title">
              인기 상품을<br>
              확인해 보세요
            </div>
            <div class="section2-sub-title">
              가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요
            </div>
          </div>
        </div>
      </div>

      <div class="section3">
        <div class="section3-inner">
          <div class="section3-block">
            <span class="section-label">Search</span>
            <div class="section3-title">
              구매를 원하는<br>
              상품을 검색하세요
            </div>
            <div class="section3-sub-title">
              구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요
            </div>
          </div>
          <img class="section3-img" src="img/img4.png" alt="sec2" width="579px" height="444px" />    
        </div>
      </div>

      <div class="section4">
        <div class="section4-inner">
          <img class="section1-img" src="img/img3.png" alt="sec3" width="579px" height="444px" />  
          <div class="section4-block">
            <span class="section-label">Register</span>
            <div class="section4-title">
              판매를 원하는<br>
              상품을 등록하세요
            </div>
            <div class="section4-sub-title">
              어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요
            </div>
          </div>
        </div>
      </div>

      <div class="section-wrapper">
        <div class="section5">
          <div class="section5-inner">
            <div class="section5-block">
              <div class="section5-title">
                믿을 수 있는<br>
                판다마켓 중고 거래
              </div>
            </div>
            <img class="section1-img" src="img/img5.png" alt="panda" width="746px" height="397px" />
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer>
    <div class="footer-container">
        <div class="footer-inner">
            <span class="footer-logo">@codeit - 2024</span>
            <div class="footer-text-group">
                <a href="/privacy" class="footer-text">Privacy Policy</a>
                <a href="/faq" class="footer-text">FAQ</a>
            </div>
            <div class="social-toggle">
                <a href="https://www.facebook.com" target="_blank">
                    <img src="img/ic_facebook.png" alt="facebook" class="icons"></img>
                </a>
                <a href="https://www.twitter.com" target="_blank">
                    <img src="img/ic_twitter.png" alt="twitter" class="icons"></img>
                </a>
                <a href="https://www.instagram.com" target="_blank">
                    <img src="img/ic_instagram.png" alt="instagram" class="icons"></img>
                </a>
                <a href="https://www.youtube.com" target="_blank">
                    <img src="img/ic_youtube.png" alt="youtube" class="icons"></img>
                </a>
            </div>
        </div>
    </div>
  </footer>
</body>
</html>
