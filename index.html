<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta
      property="og:image"
      content="https://codeit-sprint-mission3.netlify.app/assets/images/Img_forOG.png"
    />
    <meta
      property="og:url"
      content="https://codeit-sprint-mission3.netlify.app//"
    />
    <title>판다마켓</title>

    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- <h1>판다마켓 중고거래</h1> -->
    <header class="gnb">
      <nav>
        <a href="./">
          <img src="./assets/images/Img_logo.svg" alt="판다마켓 로고" />
        </a>
        <a class="btn-small-48 login-button" href="./login&singup/login.html"
          >로그인</a
        >
      </nav>
    </header>

    <main>
      <section class="intro">
        <div class="intro-container">
          <div class="intro-container-text">
            <h1>일상의 모든 물건을 거래해보세요</h1>
            <a class="see-more" href="./items">구경하러 가기</a>
          </div>
          <img src="./assets/images//Img_home_top.svg" />
        </div>
      </section>

      <section class="sections">
        <div class="card">
          <img src="./assets/images/Img_home_01.svg" alt="shopping" />
          <div class="card-description">
            <span>Hot Item</span>
            <h2>인기 상품을 확인해 보세요</h2>
            <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </section>

      <section class="sections">
        <div class="card reverse">
          <img src="./assets/images/Img_home_02.svg" alt="shopping" />
          <div class="card-description middle">
            <span>Search</span>
            <h2>구매를 원하는 상품을 검색하세요</h2>
            <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
          </div>
        </div>
      </section>

      <section class="sections last">
        <div class="card">
          <img src="./assets/images/Img_home_03.svg" alt="shopping" />
          <div class="card-description">
            <span>Register</span>
            <h2>판매를 원하는 상품을 등록하세요</h2>
            <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
          </div>
        </div>
      </section>

      <section class="banner">
        <div class="banner-wrapper">
          <p>믿을 수 있는 판다마켓 중고 거래</p>
          <img src="./assets/images/Img_home_bottom.svg" alt="panda" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-wrapper">
        <div class="codeit">©codeit - 2024</div>
        <div>
          <a href="./privacy">Privacy Policy</a>
        </div>
        <div>
          <a href="./faq">FAQ</a>
        </div>
        <div>
          <a href="https://www.facebook.com/">
            <img src="./assets/images/Img_facebook.svg" alt="facebook-logo" />
          </a>
          <a href="https://x.com/">
            <img src="./assets/images/Img_twitter.svg" alt="twitter-logo" />
          </a>
          <a href="https://www.youtube.com/">
            <img src="./assets/images/Img_youtube.svg" alt="youtube-logo" />
          </a>
          <a href="https://www.instagram.com/">
            <img src="./assets/images/Img_instagram.svg" alt="instagram-logo" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
