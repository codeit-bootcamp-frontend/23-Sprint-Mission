<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" type="text/css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header id="header">
      <a href="/">
        <img
          src="assets/logo.svg"
          id="logoImg"
          width="153px"
          height="51px"
          alt="logo"
        />
      </a>
      <a href="/login" id="loginBtn" class="button">로그인</a>
    </header>

    <section id="landingBanner">
      <div id="landingContents">
        <h2 id="landingHeader">
          일상의 모든 물건을<br />
          거래해 보세요
        </h2>
        <a href="/items" id="landingBtn" class="button">구경하러 가기</a>
      </div>
    </section>

    <section id="infos">
      <div id="infoItem">
        <img src="assets/info1.svg" alt="info1" width="579px" height="444px" />
        <div id="infoContent">
          <span class="itemHeader">Hot Item</span>
          <h2>
            인기 상품을<br />
            확인해 보세요
          </h2>
          <p>
            가장 HOT한 중고거래 물픔을 <br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
      <div id="infoItem">
        <div id="infoContent" class="left">
          <span class="itemHeader">Search</span>
          <h2 id="temp">구매를 원하는</h2>
          <h2 id="temp">상품을 검색하세요</h2>
          <p id="temp">구매하고 싶은 물품은 검색해서</p>
          <p id="temp">쉽게 찾아보세요</p>
        </div>
        <img src="assets/info2.svg" alt="info2" width="579px" height="444px" />
      </div>
      <div id="infoItem">
        <img src="assets/info3.svg" alt="info3" width="579px" height="444px" />
        <div id="infoContent">
          <span class="itemHeader">Register</span>
          <h2>판매를 원하는<br />상품을 등록하세요</h2>
          <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
        </div>
      </div>
    </section>

    <div id="line"></div>

    <section id="footerBanner">
      <h2 id="footerBannerContent">
        믿을 수 있는 <br />
        판다마켓 중고 거래
      </h2>
    </section>

    <footer id="footer">
      <a>@codeit-2025</a>
      <div id="footerNav">
        <a href="/privacy">Privacy Policy</a>
        <a href="/faq">FAQ</a>
      </div>
      <div id="logos">
        <a href="https://www.facebook.com" target="_blank">
          <img
            src="assets/snslogos/fblogo.svg"
            alt="facebooklogo"
            width="20px"
            height="20px"
          />
        </a>
        <a href="https://x.com" target="_blank">
          <img
            src="assets/snslogos/twlogo.svg"
            alt="twitterlogo"
            width="20px"
            height="20px"
          />
        </a>
        <a href="https://www.youtube.com" target="_blank">
          <img
            src="assets/snslogos/ytlogo.svg"
            alt="youtubelogo"
            width="20px"
            height="20px"
          />
        </a>
        <a href="https://www.instagram.com" target="_blank">
          <img
            src="assets/snslogos/inlogo.svg"
            alt="instagramlogo"
            width="20px"
            height="20px"
          />
        </a>
      </div>
    </footer>
  </body>
</html>
