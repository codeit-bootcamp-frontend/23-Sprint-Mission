<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="signup.css" />
    <link rel="stylesheet" href="global.css" />
  </head>
  <body>
    <div class="login-content">
      <a href="/">
        <img src="images/login_page/logo.svg" />
      </a>
      <div class="login-container">
        <div class="login-form">
          <div class="form-group">
            <label for="email">이메일</label>
            <input id="email" type="email" placeholder="이메일을 입력해주세요" />
          </div>

          <div class="form-group">
            <label for="nickname">닉네임</label>
            <input id="nickname" type="text" placeholder="닉네임을 입력해주세요" />
          </div>          

          <div class="form-group">
            <label for="password">비밀번호</label>
            <div class="password-wrapper">
              <input id="password" type="password" placeholder="비밀번호를 입력해주세요" class="password-input"/>
              <img src="images/login_page/eyes-close.svg" class="toggle-eye">
            </div>
          </div>

          <div class="form-group">
            <label>비밀번호 확인</label>
            <div class="password-wrapper">              
              <input id="re-password" type="text" placeholder="비밀번호를 다시 한 번 입력해주세요" class="password-input-repeat"/>
              <img src="images/login_page/eyes-close.svg" class="toggle-eye">
            </div>
          </div>          

          <button class="signup-button">
            
              회원가입    
            
          </button>
        </div>

        <div class="social-login">
          <div class="social-login-container">
            <p>
                간편 로그인하기
            </p>
            <div class="icon-container">
              <a href="https://www.google.com/">
                  <img src="images/ic_img/ic_google.svg">
              </a>
              <a href="https://www.kakaocorp.com/page/">
                  <img src="images/ic_img/ic_kakao.svg">
              </a>
            </div>

          </div>
        </div>

        <div class="sign-up">
          <span>이미 회원이신가요?</span>
          <a href="login.html">로그인</a>
        </div>

      </div>
    </div>
  </body>
</html>
