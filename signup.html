<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/global.css" type="text/css" />
    <link rel="stylesheet" href="styles/signup.css" type="text/css" />
    <title>판다마켓 - 회원가입</title>
  </head>
  <body>
    <main id="main">
      <img class="logo" src="assets/logo.svg" width="396px" height="132px" />
      <form id="signupForm">
        <label class="label" for="emailInput">이메일</label>
        <div class="emailInputBox" id="emailInputContainer">
          <input
            id="emailInput"
            placeholder="codeit@email.com"
            name="email"
            type="email"
            required
          />
        </div>
        <p id="emailError" class="errorMsg"></p>
        <br />
        <label class="label" for="nameInput">닉네임</label>
        <div class="nameInputBox" id="nameInputContainer">
          <input id="nameInput" placeholder="판다" name="nickname" required />
        </div>
        <p id="nicknameError" class="errorMsg"></p>
        <br />
        <label class="label" for="pwInput">비밀번호</label>
        <div class="pwInputBox" id="pwInputContainer">
          <input
            id="pwInput"
            placeholder="비밀번호를 입력해주세요."
            type="password"
            name="password"
            required
          />
          <img src="assets/visibility_off.svg" width="24px" height="24px" />
        </div>
        <p id="passwordError" class="errorMsg"></p>
        <br />
        <label class="label" for="pwconfirmInput">비밀번호 확인</label>
        <div class="pwconfirmInputBox" id="pwconfirmInputContainer">
          <input
            id="pwconfirmInput"
            type="password"
            placeholder="비밀번호를 입력해주세요."
            name="passwordConfirm"
            required
          />
          <img src="assets/visibility_off.svg" width="24px" height="24px" />
        </div>
        <p id="pwconfirmError" class="errorMsg"></p>
        <button id="signupBtn">회원가입</button>
      </form>
      <div class="socialLogin">
        <span class="socialInfo">간편 로그인하기</span>
        <ul class="logoBox">
          <a href="https://www.google.com/">
            <img alt="구글 로그인 버튼" src="assets/snslogos/googlelogo.svg" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img
              alt="카카오톡 로그인 버튼"
              src="assets/snslogos/kakaologo.svg"
            />
          </a>
        </ul>
      </div>
      <span class="footInfo"
        >이미 회원이신가요?
        <a id="loginLink" href="/login.html">로그인</a></span
      >
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
