<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="style/main.css" />
  </head>
  <body>
    <div class="form_wrapper">
      <div class="logo-home_btn_wrapper">
        <a href="./" class="logo">
          <img src="img/logo/logo.svg" alt="logo" width="396px" />
        </a>
      </div>

      <form class="form">
        <div class="input_item">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력해주세요"
            required
            autofocus
          />
          <p class="error_msg email--error_msg"></p>
        </div>
        <div class="input_item">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            placeholder="닉네임을 입력해주세요"
            required
          />
          <p class="error_msg nickname--error_msg"></p>
        </div>
        <div class="input_item">
          <label for="password">비밀번호</label>
          <div class="password_wrap">
            <input
              type="password"
              id="password"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <button type="button" class="password_icon" data-target="password">
              <img
                src="img/icon/password_hidden_icon.svg"
                alt="password_hidden_icon"
                data-visible="img/icon/password_visible_icon.svg"
                data-hidden="img/icon/password_hidden_icon.svg"
              />
            </button>
          </div>
          <p class="error_msg password--error_msg"></p>
        </div>
        <div class="input_item">
          <label for="password_confirm">비밀번호 확인</label>
          <div class="password_wrap">
            <input
              type="password"
              id="password_confirm"
              placeholder="비밀번호를 다시 입력해주세요"
              required
            />
            <button
              type="button"
              class="password_icon"
              data-target="password_confirm"
            >
              <img
                src="img/icon/password_hidden_icon.svg"
                alt="password_hidden_icon"
                data-visible="img/icon/password_visible_icon.svg"
                data-hidden="img/icon/password_hidden_icon.svg"
              />
            </button>
          </div>
          <p class="error_msg password_confirm--error_msg"></p>
        </div>
        <button type="submit" class="submit-login_btn btn" disabled>
          회원가입
        </button>
      </form>
      <!--social_login-->
      <div class="social_login">
        <span>간편 로그인하기</span>
        <div class="social_login_btn">
          <a href="https://www.google.com/">
            <img src="img/sns_icon/google_icon.svg" alt="google" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="img/sns_icon/kakao_icon.svg" alt="kakao" />
          </a>
        </div>
      </div>
      <!--go_to_login-->
      <div class="go_login">
        <span>이미 판다마켓 회원이신가요?</span>
        <a href="./login.html" class="login_btn">로그인</a>
      </div>
    </div>
    <script type="module" src="./script/pages/signup.js"></script>
  </body>
</html>
