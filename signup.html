<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>login</title>
  </head>
  <body>
    <div class="login-full-section">
      <div class="login-logo">
        <img src="img/logo.png" alt="logo" width="396px" height="132px" />
      </div>
      <div class="login-form">
        <span class="login-text">이메일</span>
        <input class="email-area" type="email" autocomplete="username" />

        <span class="login-text">닉네임</span>
        <input class="email-area" type="name" autocomplete="username" />

        <span class="login-text">비밀번호</span>
        <input
          class="password-area"
          type="password"
          autocomplete="current-password"
        />

        <span class="login-text">비밀번호 확인</span>
        <input
          class="password-area"
          type="password"
          autocomplete="current-password"
        />
        <div class="register-form-btn">회원가입</div>
        <div class="newuser-text-area">
          <span>이미 회원이신가요?</span>
          <a href="/login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
