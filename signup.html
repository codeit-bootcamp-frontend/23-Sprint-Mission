<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/signup.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <main class="singup-page">
      <section class="signup-box">
        <a href="/">
          <img aclass="pandaLogo" src="img/logo.svg" alt="판다마켓 로고" />
        </a>
        <form class="signup-form" action="#">
          <!-- 이메일 입력 -->
          <div class="field">
            <label class="email-label" for="email">이메일</label>

            <div class="field-body">
              <input
                class="email-input"
                id="email"
                type="email"
                placeholder="이메일을 입력해주세요"
              />
              <!-- 에러 : 잘못된 이메일입니다.-->
              <p class="email-error-message" id="email-error-message"></p>
            </div>
          </div>
          <!-- 닉네임 입력 -->
          <div class="field">
            <label class="nickname-label" for="nickname">닉네임</label>
            <div class="field-body">
              <input
                class="nickname-input"
                id="nickname"
                type="text"
                placeholder="닉네임을 입력해주세요"
              />
              <p class="nickname-error-message" id="nickname-error-message"></p>
            </div>
          </div>
          <!-- 비밀번호 입력 -->
          <div class="field">
            <label class="passwd-label" for="password">비밀번호</label>

            <div class="field-body">
              <input
                class="passwd-input"
                id="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <!-- 에러 : 비밀번호를 8자 이상 입력해주세요.-->
              <p class="passwd-error-message" id="passwd-error-message"></p>
            </div>
          </div>
          <!-- 비밀번호 확인 -->
          <div class="field">
            <label class="passwdcheck-label" for="passwdcheck"
              >비밀번호 확인</label
            >

            <div class="field-body">
              <input
                class="passwdcheck-input"
                id="passwdcheck"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <!-- 에러 : 비밀번호가 일치하지 않습니다.-->
              <p
                class="passwdcheck-error-message"
                id="passwdcheck-error-message"
              ></p>
            </div>
          </div>
          <!-- 회원가입 버튼 -->
          <div class="actions">
            <button
              class="signup-button"
              id="signup-button"
              type="submit"
              disabled
            >
              회원가입
            </button>
          </div>
          <!-- 간편 로그인하기 -->
          <div class="social-login">
            <span class="social-text">간편 로그인하기</span>
            <div class="social-icons">
              <a href="https://www.google.com/"
                ><img src="img/icon_google.svg" alt="구글 아이콘"
              /></a>
              <a href="https://www.kakaocorp.com/page"
                ><img src="img/icon_kakao.svg" alt="카카오 아이콘"
              /></a>
            </div>
          </div>
          <!-- 이미 회원이신가요? 로그인 링크 -->
          <div class="signin">
            <span class="signin-text">이미 회원이신가요?</span>
            <a class="signin-page" href="login.html">로그인</a>
          </div>
        </form>
      </section>
    </main>
    <script src="js/signup.js"></script>
  </body>
</html>
