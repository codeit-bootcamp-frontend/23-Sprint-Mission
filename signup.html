<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="wrap">
        <div class="section-login">
            <div class="login-inner">
                <a href="/" class="login-logo"><img src="img/pandamarket_logo.svg" alt="판다마켓로고"></a>
                <div class="login-input-box">
                    <form action="">
                        <div class="login-input">
                            <label for="" class="login-label">이메일</label>
                            <input type="text" placeholder="이메일을 입력하세요">
                        </div>
                        <div class="login-input">
                            <label for="" class="login-label">닉네임</label>
                            <input type="text" placeholder="판다">
                        </div>
                        <div class="login-input">
                            <label for="" class="login-label">비밀번호</label>
                            <div class="login-input">
                                <input type="password" placeholder="비밀번호를 입력하세요">
                                <div class="input-text-show">
                                    <div class="btn-eye-close btn"><img src="img/icon-eyes-close.svg" alt=""></div>
                                </div>
                            </div>
                        </div>
                        <div class="login-input">
                            <label for="" class="login-label">비밀번호 확인</label>
                            <div class="login-input">
                                <input type="password" placeholder="비밀번호를 입력하세요">
                                <div class="input-text-show">
                                    <div class="btn-eye-close btn"><img src="img/icon-eyes-open.svg" alt=""></div>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn_large btn_join">회원가입</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
