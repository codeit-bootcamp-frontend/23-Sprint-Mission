<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>판다마켓 - 회원가입</title>
        <link
        rel="stylesheet"
        as="style"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
        <link rel="stylesheet" href="styles/main.css">
        <link rel="stylesheet" href="styles/sign.css">
    </head>
    <body>
        <header>
            <a href="/">
                <img src="images/logo/panda_logo.svg" alt="판다마켓 로고">
            </a>
        </header>
        <section>
            <form>
                <div class="input-item">
                    <label>이메일</label>
                    <input id="email" name="email" type="email" placeholder="example@email.com">
                </div>
                <div class="input-item">
                    <label>닉네임</label>
                    <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력하세요">
                </div>
                <div class="input-item">
                    <label>비밀번호</label>
                    <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요">
                </div>
                <div class="input-item">
                    <label>비밀번호 확인</label>
                    <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요">
                </div>
                <button type="submit">회원가입</button>
            </form>
            <div class="sign">
                <p>이미 회원이신가요?</p>
                <a href="signin.html">로그인</a>
            </div>
        </section>
    </body>
</html>
