<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/signup.css">
  </head>
  <body>
    <header>
      <a class="home-button" href="/">
        <img class="header-logo" src="./img/Img_logo_lg.png" alt="판다마켓 로고">
      </a>
    </header>
    <main class="main">
      <form class="main-form">
        <div class="input">
          <label for="signup-email">이메일</label>
          <input 
            id="signup-email" 
            class="input-main"
            name="email" 
            type="email"
            placeholder="이메일을 입력해주세요" 
            required
          >
          <p class="error-message"></p>
        </div>
        <div class="input">
          <label for="signup-nickname">닉네임</label>
          <input 
            id="signup-nickname" 
            class="input-main"
            name="nickname" 
            type="text" 
            placeholder="닉네임을 입력해주세요" 
            required
          >
          <p class="error-message"></p>
        </div>
        <div class="input">
          <label for="signup-password">비밀번호</label>
          <div class="signup-password-content">
            <input 
              id="signup-password" 
              class="input-main"
              name="password" 
              type="password" 
              placeholder="비밀번호를 입력해주세요" 
              required
            >
            <img class="visibility-button" src="./img/ic_visibility_off.svg" alt="비밀번호 숨김/보기 버튼">
          </div>
          <p class="error-message"></p>
        </div>
        <div class="input">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <div class="signup-password-content">
            <input 
              id="signup-password-confirm" 
              class="input-main"
              name="password" 
              type="password" 
              placeholder="비밀번호를 다시 한 번 입력해주세요" 
              required
            >
            <img class="visibility-button" src="./img/ic_visibility_off.svg" alt="비밀번호 숨김/보기 버튼">
          </div>
          <p class="error-message"></p>
        </div>
        <button class="signup-button" type="button" disabled>
          회원가입
        </button>
      </form>
      <div class="social-login">
        <span>간편 로그인하기</span>
        <div class="social-login-buttons">
          <a class="social-login-button" href="https://www.google.com/">
            <img class="social-image" src="./img/ic_google.svg" alt="구글 로그인 버튼">
          </a>
          <a class="social-login-button" href="https://www.kakaocorp.com/page/">
            <img class="social-image" src="./img/ic_kakao.svg" alt="카카오 로그인 버튼">
          </a>
        </div>
      </div>
      <div class="login">
        <span class="login-script">이미 회원이신가요?</span>
        <a class="login-button" href="./login.html">로그인</a>
      </div>
    </main>
    <script type="module" src="./js/signup.js"></script>
  </body>
</html>
