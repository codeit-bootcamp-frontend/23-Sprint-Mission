<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓 - 회원가입</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <img src="img/logo.png" alt="판다마켓" class="logo-image">
        </div>

        <form>
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" class="form-input" placeholder="codeit@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">닉네임</label>
                <input type="text" class="form-input" placeholder="판다">
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="•••••••" id="passwordInput">
                    <button type="button" class="password-toggle" onclick="togglePassword('passwordInput')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <div class="input-wrapper">
                    <input type="password" class="form-input" placeholder="woflfff" id="passwordConfirmInput">
                    <button type="button" class="password-toggle" onclick="togglePassword('passwordConfirmInput')">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">회원가입</button>
        </form>

        <div class="social-login-section">
            <span class="social-login-text">간편 로그인하기</span>
            <div class="social-buttons">
                <button id="social-button" class="google" aria-label="Google 로그인">
                    <img src="img/google.png" alt="Google">
                </button>
                <button id="social-button" class="kakao" aria-label="Kakao 로그인">
                    <img src="img/kakao.png" alt="Kakao">
                </button>
            </div>
        </div>

        <div class="signup-link">
            이미 회원이신가요? <a href="login.html">로그인</a>
        </div>
    </div>
</body>
</html>
