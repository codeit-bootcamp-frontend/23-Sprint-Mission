<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/signup.css" />
    <title>판다마켓 회원가입</title>
  </head>
  <body>
    <main class="singup-page">
      <section class="signup-box">
        <img class="pandaLogo" src="img/logo.svg" alt="판다마켓 로고" />
        <form class="signup-form" action="#">
          <!-- 이메일 입력 -->
          <div class="field">
            <label class="email-label" for="email">이메일</label>
          </div>
          <input
            class="email-input"
            id="email"
            type="email"
            placeholder="codeit@email.com"
          />
          <!-- 닉네임 입력 -->
          <div class="field">
            <label class="nickname-label" for="nickname">닉네임</label>
          </div>
          <input
            class="nickname-input"
            id="nickname"
            type="text"
            placeholder="판다"
          />
          <!-- 비밀번호 -->
          <div class="field">
            <label class="pass-label" for="password">비밀번호</label>
            <input class="pass-input" id="password" type="password" />
          </div>
          <!-- 비밀번호 확인 -->
          <div class="field">
            <label class="passcheck-label" for="passcheck">비밀번호 확인</label>
            <input class="passcheck-input" id="passcheck" type="text" />
          </div>
          <!-- 회원가입 버튼 -->
          <div class="actions">
            <button class="signup-button" type="submit">회원가입</button>
          </div>
          <!-- 간편 로그인하기 -->
          <div class="social-login">
            <span class="social-text">간편 로그인하기</span>
            <div class="social-icons">
              <a href="https://www.google.com/"
                ><img src="img/ic_google.svg" alt="구글 아이콘"
              /></a>
              <a href="https://www.kakaocorp.com/page"
                ><img src="img/ic_kakao.svg" alt="카카오 아이콘"
              /></a>
            </div>
          </div>
          <!-- 이미 회원이신가요? 로그인 링크 -->
          <div class="signin">
            <span class="signin-text">이미 회원이신가요?</span>
            <a class="signin-page" href="login.html">로그인</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
