<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="signup_style.css" />
  </head>
  <body>
    <main>
      <header>
        <nav>
        <img class="panda-img" src="images/panda_logo.svg" alt="판다 로고" />
        <a class="panda-text" href="/"><strong>판다마켓</strong></a>
      </nav>
      </header>

      <section>
        <div class="section-input">
          <div class="all-input">
            <div class="email">
              <p class="email-txt">이메일</p>
              <input type="text" class="email-input" />
            </div>

            <div class="nickname">
              <p class="nickname-txt">닉네임</p>
              <input type="text" class="nickname-input" />
            </div>

            <div class="password">
              <p class="password-txt">비밀번호</p>
              <div class="password-eye">
                <input type="password" class="password-input"/>
                <img class="eye-icon" src="images/eye.svg" alt="눈 아이콘">
            </div>

            <div class="password-check">
              <p class="password-check-txt">비밀번호 확인</p>
              <div class="password-check-eye">
                <input type="text" class="password-check-input"/>
                <img class="eye-check-icon" src="images/eye-check.svg" alt="눈 아이콘">
            </div>
          </div>
          <a class="signup-btn" href="/">회원가입</a>
        </div>
        <div class="easy-login">
          <p class="try-go-login">간편 로그인하기</p>
          <div class="sns-icons">
            <a href="https://www.google.com/">
              <img class="sns" src="images/google.svg" alt="구글 로고" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img class="sns" src="images/kakao.svg" alt="카카오톡 로고" />
            </a>
          </div>
        </div>
        <div class="sign-txt">
          <p class="already-time">이미 회원이신가요?</p>
          <a class="sign-up-btn" href="/index.html">로그인</a>
        </div>
      </section>
    </main>
  </body>
</html>
